<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BeaconTube</title>
    <!-- Relative addresses only: Beacon serves this page from its own
         address, and only relative ones follow it there. -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="standalone" class="standalone" hidden>
      Open this page from its tab in Beacon to play music. On its own it can only fetch and list links.
    </div>

    <section id="hero" class="hero" aria-live="polite"></section>

    <!-- Sticky, so a search is one keystroke away however far down the lists are. -->
    <div class="search-bar">
      <form id="form" class="search" autocomplete="off" role="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"
          />
        </svg>
        <input
          id="query"
          type="search"
          enterkeyhint="search"
          placeholder="Search YouTube, or paste a link"
          aria-label="Search YouTube, or paste a link"
        />
        <kbd class="search__key" aria-hidden="true">/</kbd>
        <button id="go" type="submit" class="pill">Search</button>
      </form>
      <nav class="tabs" role="tablist" aria-label="View">
        <button type="button" class="tab is-active" role="tab" aria-selected="true" data-view="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" /></svg>
          <span class="tab__label">Home</span>
        </button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-view="library">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2m-1 9h-4v4h-2v-4H9V9h4V5h2v4h4z"
            />
          </svg>
          <span class="tab__label">Library</span>
          <span id="library-tab-count" class="tab__count"></span>
        </button>
      </nav>
    </div>

    <main>
      <section id="results" class="section" hidden>
        <div class="section__head">
          <h2 id="results-title" class="section-title">Results</h2>
          <button id="close-results" type="button" class="pill tonal small">Close</button>
        </div>
        <ul id="result-list" class="cards"></ul>
      </section>

      <div id="home-view">
        <section class="section">
          <h2 class="section-title">Recently played</h2>
          <ul id="recent" class="tiles"></ul>
        </section>

        <div class="split">
          <section class="section">
            <div class="section__head">
              <h2 class="section-title">Most played</h2>
              <button type="button" class="link-btn" data-view="library" data-sort="plays">Show all</button>
            </div>
            <ol id="most-played" class="ranked"></ol>
          </section>

          <section class="section">
            <h2 class="section-title">Top channels</h2>
            <ol id="channels" class="ranked"></ol>
          </section>
        </div>
      </div>

      <div id="library-view" hidden>
        <section class="section">
          <div class="section__head">
            <h2 class="section-title">Library <span id="library-count" class="section-title__count"></span></h2>
          </div>
          <div class="library-controls">
            <div class="filter">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 18h4v-2h-4zM3 6v2h18V6zm3 7h12v-2H6z" />
              </svg>
              <input id="library-filter" type="search" placeholder="Filter by title or channel" aria-label="Filter the library" />
            </div>
            <select id="library-sort" class="sort" aria-label="Sort the library">
              <option value="recent">Recently played</option>
              <option value="plays">Most played</option>
              <option value="title">Title</option>
              <option value="channel">Channel</option>
            </select>
          </div>
          <ul id="library-list" class="library"></ul>
        </section>
      </div>
    </main>

    <div id="toast" class="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
